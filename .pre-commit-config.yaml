repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.10.0
    hooks:
      - id: mypy
        args: [--ignore-missing-imports]
        additional_dependencies: [pandas-stubs, types-requests]

  - repo: https://github.com/kynan/nbstripout
    rev: 0.7.1
    hooks:
      - id: nbstripout

  - repo: local
    hooks:
      - id: no-lookahead
        name: Check for lookahead patterns
        language: pygrep
        entry: "shift\(-[1-9]|\.future\.|look_ahead|lookahead"
        files: "src/.*\\.py$"
        exclude: "tests/.*"

      - id: cutoff-date-required
        name: Indicators must accept cutoff_date
        language: pygrep
        entry: "class.*Indicator"
        files: "src/indicators/.*\\.py$"
        pass_filenames: true
