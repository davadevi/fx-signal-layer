name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [develop]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Lint (ruff)
        run: uv run ruff check src/ tests/

      - name: Type check (mypy)
        run: uv run mypy src/ --ignore-missing-imports

      - name: Test
        run: uv run pytest tests/ -v --tb=short

      - name: Check no-lookahead patterns
        run: |
          if grep -rn '\.shift(-[1-9]' src/; then
            echo "BLOCKER: negative shift found in src/ — lookahead violation"
            exit 1
          fi
